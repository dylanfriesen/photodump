services:
  photodump:
    build: .
    container_name: ${CONTAINER_NAME:-photodump}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8096}:8000"
    volumes:
      - ./data:/srv/data
    environment:
      - COMFY_HOST=${COMFY_HOST:-100.109.223.93}
      - COMFY_PORT=${COMFY_PORT:-8188}
      - OLLAMA_URL=${OLLAMA_URL:-http://100.109.223.93:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      - CHECKPOINT=${CHECKPOINT:-waiNSFWIllustrious_v140.safetensors}
      - DATA_DIR=${DATA_DIR:-/srv/data}
      - WAN_UNET=${WAN_UNET:-wan2.2_ti2v_5B_fp16.safetensors}
      - WAN_CLIP=${WAN_CLIP:-umt5_xxl_fp16.safetensors}
      - WAN_VAE=${WAN_VAE:-wan2.2_vae.safetensors}
    networks:
      default:
      web:
        aliases: ["${CONTAINER_NAME:-photodump}"]

networks:
  web:
    external: true
